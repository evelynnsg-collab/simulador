<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b7786"><title>Simulador de Manobras — Pátio</title><style>*{box-sizing:border-box}:root{--bg:#eef3f6;--c:#fff;--bd:#d8e2e7;--tx:#152126;--mu:#64727b;--a:#0b7786;--ok:#167a45;--er:#b42318;--y:#ffd400}body{margin:0;background:var(--bg);color:var(--tx);font:15px Arial,sans-serif}main{max-width:1500px;margin:auto;padding:12px}.nav,.cmd{display:flex;gap:8px;flex-wrap:wrap}button{min-height:44px;padding:9px 13px;border:1px solid var(--bd);border-radius:10px;background:#fff;font-weight:700;cursor:pointer}button.on{background:var(--a);color:#fff;border-color:var(--a)}.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.sm{font-size:12px;color:var(--mu)}#instruction,#feedback{margin-top:9px;padding:10px;border:1px solid var(--bd);border-radius:10px}.viewer{overflow:auto;background:#0a3952;border-radius:14px;padding:6px}.stage{position:relative;width:min(1271px,100%);margin:auto}.stage img{display:block;width:100%;height:auto}.sig{position:absolute;left:var(--x);top:var(--y);width:24px;height:24px;min-height:0;padding:0;transform:translate(-50%,-50%);border:0;background:transparent!important;border-radius:50%;z-index:9;appearance:none}.sig:after{content:"";position:absolute;inset:1px;border:2px solid transparent;border-radius:50%;background:transparent;pointer-events:none}.sig.sel:after{border-color:#ffd400}.sig.blink:after{border-color:#ffd400;animation:ringblink .7s steps(1) infinite}.sig.blink:before{content:"";position:absolute;inset:4px;border-radius:50%;background:#c93a36;animation:blink .7s steps(1) infinite;pointer-events:none}@keyframes blink{50%{opacity:0}}@keyframes ringblink{50%{border-color:transparent}}#train{position:absolute;width:56px;height:26px;left:14%;top:53%;transform:translate(-50%,-50%);border:2px solid #233;border-radius:8px;background:#dce8ed;z-index:5;transition:.35s}#train .tw{position:absolute;top:5px;width:13px;height:8px;background:#789bab;border-radius:2px}#train .tw.left{left:7px}#train .tw.right{right:7px}#train .wheel{position:absolute;bottom:-5px;width:8px;height:8px;background:#222;border-radius:50%}#train .wheel.left{left:10px}#train .wheel.right{right:10px}.cmd button.cmd-correct{background:#179447!important;color:#fff!important;border-color:#117738!important}.cmd button.cmd-error{background:#d5392f!important;color:#fff!important;border-color:#a9251e!important}.success-popup{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(7,27,38,.58);padding:18px}.success-popup.hidden{display:none!important}.success-box{position:relative;z-index:2;width:min(92vw,520px);padding:28px 24px;border-radius:20px;background:#fff;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popin .28s ease-out}.success-box h2{margin:0 0 18px;font-size:clamp(22px,4vw,32px);color:#167a45}.success-box button{background:#0b7786;color:#fff;border-color:#0b7786;min-width:120px}.confetti-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti{position:absolute;top:-12vh;width:10px;height:16px;border-radius:2px;animation:fall var(--d) linear forwards;transform:rotate(var(--r))}@keyframes popin{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fall{to{transform:translate3d(var(--x),115vh,0) rotate(calc(var(--r) + 720deg));opacity:.95}}.hidden{display:none!important}.ok{color:var(--ok);font-weight:800}.err{color:var(--er);font-weight:800}details{margin-top:10px}@media(max-width:700px){main{padding:8px}.stage{min-width:840px}.viewer{overflow-x:auto}}</style></head><body><main id="app"><div class="nav"><button id="p1" class="on">Fase 1 — Colocando trem no pátio</button><button id="p2">Fase 2 — Retirando trem do pátio</button><button id="fs">Tela cheia</button><button id="reset">Reiniciar fase</button></div><section class="card"><div class="row"><div><div class="sm">Treinamento atual</div><b id="title">Colocando trem no pátio</b></div><div style="text-align:right"><div class="sm">Progresso</div><b id="prog">0 / 10</b></div></div><div id="instruction">1. Selecione o sinal 2E ou 4E da L26 para alinhar o trem na plataforma 1.</div></section><div class="viewer" id="view"><div class="stage"><img src="data:image/webp;base64,UklGRh7rAABXRUJQVlA4IBLrAACwMQOdASr3BDQCPj0cjESiIaMhJFF7IGAHiWNuLbxd3+HEh/y5lf3Cw4dnNmf/g9R/8W/q/7Ne9dn2zm5V3/F+uv+L8S/9bz+f+HFIJT0rTu6t0sy0NJPidHpv9jvgu1f7/1Mf8D6vGW303drAxzPPvLJZ6j1Po8XgpMIm5NGj7BVv2FnVv9+zrlNpi9f03/ru...TRUNCATED_FOR_DISPLAY..." alt="Painel ferroviário"><button class="sig" data-s="3EF" style="--x:12.70%;--y:17.73%" aria-label="Sinal 3EF"></button><button class="sig" data-s="6E_L26" style="--x:51.81%;--y:14.53%" aria-label="Sinal 6E da L26"></button><button class="sig" data-s="6E_L27" style="--x:89.69%;--y:14.11%" aria-label="Sinal 6E da L27"></button><button class="sig" data-s="6D" style="--x:32.28%;--y:25.89%" aria-label="Sinal 6D da L27"></button><button class="sig" data-s="2E" style="--x:52.04%;--y:34.77%" aria-label="Sinal 2E"></button><button class="sig" data-s="2D" style="--x:11.06%;--y:47.30%" aria-label="Sinal 2D da L26"></button><button class="sig" data-s="4E" style="--x:47.48%;--y:57.00%" aria-label="Sinal 4E"></button><div id="train"><span class="tw left"></span><span class="tw right"></span><span class="wheel left"></span><span class="wheel right"></span></div></div></div><section class="card"><b>Caixa de comando</b><div class="cmd" style="margin-top:9px"><button data-c="ROTA_DESP">ROTA_DESP</button><button data-c="ROTA_CHMD">ROTA_CHMD</button><button data-c="CANC_ROTA">CANC ROTA</button><button data-c="CONFIRMA">CONFIRMA</button><button id="move" class="hidden on">Trem entrou no chicote</button></div></section><section id="feedback" class="card">Clique na bolinha vermelha indicada para iniciar.</section><details class="card"><summary><b>Ver roteiro completo</b></summary><div id="ref" style="margin-top:10px;line-height:1.65"></div></details></main><div id="successPopup" class="success-popup hidden" role="dialog" aria-modal="true" aria-labelledby="successTitle"><div id="confettiLayer" class="confetti-layer"></div><div class="success-box"><h2 id="successTitle">Treinamento concluído com sucesso ✔</h2><button id="closeSuccess" type="button">Fechar</button></div></div><script>(()=>{const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),F={i:[['s',['2E','4E'],'1. Selecione o sinal 2E ou 4E da L26 para alinhar o trem na plataforma 1.'],['c',['ROTA_DESP'],'2. Na caixa de comando, selecione ROTA_DESP.'],['s',['2E'],'3. Selecione o sinal 2E da L27.'],['c',['CONFIRMA'],'3. Clique em CONFIRMA.'],['s',['2E'],'4. Selecione novamente o sinal 2E da L27.'],['c',['ROTA_DESP'],'4. Selecione ROTA_DESP.'],['s',['3EF'],'4. Selecione o sinal 3EF. O trem ficará no chicote.'],['s',['6D'],'5. Selecione o sinal 6D da L27.'],['c',['ROTA_DESP'],'5. Selecione ROTA_DESP.'],['s',['2D'],'5. Selecione o sinal 2D da L26 para concluir.']],o:[['s',['6E_L26'],'1. Selecione o sinal 6E da L26.'],['c',['ROTA_CHMD'],'2. Selecione ROTA_CHMD.'],['s',['6E_L27'],'3. Selecione o sinal 6E da L27. A bolinha vermelha ficará piscando.'],['m',['MOVE'],'4. Depois que o trem sair do pátio e entrar no chicote, confirme em “Trem entrou no chicote”.'],['s',['6E_L26'],'4. Clique no sinal 6E da L26.'],['c',['CANC_ROTA'],'4. Selecione CANC ROTA.'],['s',['6E_L27'],'4. Selecione o sinal 6E da L27.'],['c',['CONFIRMA'],'4. Clique em CONFIRMA para concluir.']]};const R={i:'<b>Colocando trem no pátio</b><br>1. 2E ou 4E da L26 → ROTA_DESP → 2E da L27 → CONFIRMA.<br>2. 2E da L27 → ROTA_DESP → 3EF. <i>O trem ficará no chicote.</i><br>3. 6D da L27 → ROTA_DESP → 2D da L26.',o:'<b>Retirando trem do pátio</b><br>1. 6E da L26 → ROTA_CHMD → 6E da L27.<br><i>O sinaleiro fica vermelho e piscando.</i><br>2. Depois que o trem entrar no chicote: 6E da L26 → CANC ROTA → 6E da L27 → CONFIRMA.'},P={start:['14%','53%'],r2:['52%','53%'],r4:['48.5%','65%'],ch:['47%','82%'],exit:['80%','18%']};let mode='i',step=0,celebrated=false;const train=$('#train'),move=$('#move');function clearCmdFeedback(){$$('[data-c],#move').forEach(b=>b.classList.remove('cmd-correct','cmd-error'))}function paintCmd(el,ok){if(!el)return;clearCmdFeedback();el.classList.add(ok?'cmd-correct':'cmd-error')}function showCelebration(){if(celebrated)return;celebrated=true;const pop=$('#successPopup'),layer=$('#confettiLayer');layer.innerHTML='';const colors=['#ffd400','#0b7786','#ff7a00','#19a451','#e63946','#7b61ff'];for(let i=0;i<90;i++){const c=document.createElement('span');c.className='confetti';c.style.left=(Math.random()*100)+'vw';c.style.background=colors[i%colors.length];c.style.setProperty('--d',(2.3+Math.random()*2.4)+'s');c.style.setProperty('--r',(Math.random()*360)+'deg');c.style.setProperty('--x',(-70+Math.random()*140)+'px');c.style.animationDelay=(Math.random()*.45)+'s';layer.appendChild(c)}pop.classList.remove('hidden')}function pos(p){train.style.left=p[0];train.style.top=p[1]}function clr(){$$('.sig').forEach(x=>x.classList.remove('sel','blink'))}function mark(v,b=false){clr();const x=$(`.sig[data-s="${v}"]`);if(x){x.classList.add('sel');if(b)x.classList.add('blink')}}function ui(){const f=F[mode];$('#title').textContent=mode==='i'?'Colocando trem no pátio':'Retirando trem do pátio';$('#prog').textContent=`${step} / ${f.length}`;$('#ref').innerHTML=R[mode];if(step>=f.length){$('#instruction').textContent='Treinamento concluído com sucesso.';$('#feedback').innerHTML='<span class="ok">✓ Sequência concluída corretamente.</span>';move.classList.add('hidden');if(mode==='o')showCelebration();return}$('#instruction').textContent=f[step][2];move.classList.toggle('hidden',f[step][0]!=='m')}function act(t,v,el=null){const q=F[mode][step];const correct=!!q&&t===q[0]&&q[1].includes(v);if(t==='c'||t==='m')paintCmd(el,correct);if(!correct){$('#feedback').innerHTML='<span class="err">Ação incorreta.</span> Execute o comando indicado acima.';return}$('#feedback').innerHTML='<span class="ok">✓ Correto.</span> Continue.';if(t==='s')mark(v);if(mode==='i'){if(step===0)pos(v==='2E'?P.r2:P.r4);if(step===6&&v==='3EF')pos(P.ch)}else{if(step===2&&v==='6E_L27')mark(v,true);if(step===3&&t==='m'){clr();pos(P.ch)}if(step===7&&v==='CONFIRMA')pos(P.exit)}step++;ui()}$$('.sig').forEach(x=>x.onclick=()=>act('s',x.dataset.s,x));$$('[data-c]').forEach(x=>x.onclick=()=>act('c',x.dataset.c,x));move.onclick=()=>act('m','MOVE',move);function phase(m){mode=m;step=0;celebrated=false;clr();clearCmdFeedback();$('#successPopup').classList.add('hidden');$('#p1').classList.toggle('on',m==='i');$('#p2').classList.toggle('on',m==='o');$('#feedback').textContent='Clique na bolinha vermelha indicada para iniciar.';pos(m==='i'?P.start:P.ch);ui()}$('#closeSuccess').onclick=()=>$('#successPopup').classList.add('hidden');$('#successPopup').onclick=e=>{if(e.target.id==='successPopup')$('#successPopup').classList.add('hidden')};$('#p1').onclick=()=>phase('i');$('#p2').onclick=()=>phase('o');$('#reset').onclick=()=>phase(mode);$('#fs').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await $('#view').requestFullscreen()}catch(e){}};phase('i')})();</script></body></html>
